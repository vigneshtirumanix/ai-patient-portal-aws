<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Portal</title>
<style>
  :root {
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --border: #E2E5E9;
    --text: #1C2530;
    --muted: #5B6472;
    --accent: #2C6E63;
    --accent-dark: #1F4F47;
    --danger: #B3492A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .container { width: 100%; max-width: 640px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 32px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: var(--border); cursor: not-allowed; }
  .status { font-size: 13px; margin-top: 12px; }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent); }
  .record {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .record-id { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .entity-tag {
    display: inline-block;
    background: #EAF2F0;
    color: var(--accent-dark);
    border-radius: 4px;
    padding: 2px 8px;
    margin: 2px 4px 2px 0;
    font-size: 12px;
  }
  .hidden { display: none; }
  .logout-link { font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <h1>Patient Portal</h1>
  <p class="subtitle">Secure access to processed patient records</p>

  <!-- LOGIN CARD -->
  <div class="card" id="login-card">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button id="login-btn" onclick="login()">Log in</button>
    <div id="login-status" class="status"></div>
  </div>

  <!-- RECORDS CARD -->
  <div class="card hidden" id="records-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <strong>Patient Records</strong>
      <span class="logout-link" onclick="logout()">Log out</span>
    </div>
    <button onclick="fetchRecords()">Refresh records</button>
    <div id="records-status" class="status"></div>
    <div id="records-list" style="margin-top:16px;"></div>
  </div>
</div>

<script>
  // ---- CONFIG: replace these with your actual AWS resource values ----
  const CLIENT_ID = "YOUR_COGNITO_APP_CLIENT_ID";
  const COGNITO_REGION = "us-east-2";
  const API_URL = "https://YOUR_API_ID.execute-api.us-east-2.amazonaws.com/records";
  // -----------------------------------------------------------------------

  let idToken = null;

  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const statusEl = document.getElementById('login-status');
    const btn = document.getElementById('login-btn');

    statusEl.textContent = "";
    statusEl.className = "status";
    btn.disabled = true;
    btn.textContent = "Logging in...";

    try {
      const response = await fetch(`https://cognito-idp.${COGNITO_REGION}.amazonaws.com/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-amz-json-1.1",
          "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth"
        },
        body: JSON.stringify({
          AuthFlow: "USER_PASSWORD_AUTH",
          ClientId: CLIENT_ID,
          AuthParameters: { USERNAME: email, PASSWORD: password }
        })
      });

      const data = await response.json();

      if (data.ChallengeName === "NEW_PASSWORD_REQUIRED") {
        statusEl.textContent = "This account needs a new password. Please reset it first (see build guide) before logging in here.";
        statusEl.className = "status error";
        return;
      }

      if (!response.ok || !data.AuthenticationResult) {
        statusEl.textContent = data.message || "Login failed. Check your email/password.";
        statusEl.className = "status error";
        return;
      }

      idToken = data.AuthenticationResult.IdToken;
      statusEl.textContent = "Logged in successfully.";
      statusEl.className = "status ok";

      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('records-card').classList.remove('hidden');
      fetchRecords();

    } catch (err) {
      statusEl.textContent = "Network error: " + err.message;
      statusEl.className = "status error";
    } finally {
      btn.disabled = false;
      btn.textContent = "Log in";
    }
  }

  function logout() {
    idToken = null;
    document.getElementById('records-card').classList.add('hidden');
    document.getElementById('login-card').classList.remove('hidden');
    document.getElementById('login-status').textContent = "";
    document.getElementById('records-list').innerHTML = "";
  }

  async function fetchRecords() {
    const statusEl = document.getElementById('records-status');
    const listEl = document.getElementById('records-list');
    statusEl.textContent = "Loading...";
    statusEl.className = "status";

    try {
      const response = await fetch(API_URL, {
        headers: { "Authorization": "Bearer " + idToken }
      });

      if (response.status === 401) {
        statusEl.textContent = "Session expired. Please log in again.";
        statusEl.className = "status error";
        logout();
        return;
      }

      const records = await response.json();
      statusEl.textContent = `Loaded ${records.length} record(s).`;
      statusEl.className = "status ok";

      listEl.innerHTML = records.map(r => `
        <div class="record">
          <div class="record-id">Record ID: ${r.record_id}</div>
          <div><strong>Source file:</strong> ${r.source_key}</div>
          <div style="margin-top:8px;"><strong>Entities detected:</strong><br>
            ${(r.entities || []).map(e => `<span class="entity-tag">${e.text} (${e.category})</span>`).join('') || 'None'}
          </div>
        </div>
      `).join('');

    } catch (err) {
      statusEl.textContent = "Error fetching records: " + err.message;
      statusEl.className = "status error";
    }
  }
</script>
</body>
</html>
